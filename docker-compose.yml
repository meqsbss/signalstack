name: signalstack

services:
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/signalstack.db
      OTEL_SERVICE_NAME: signalstack-api-dev
    volumes:
      - dev-data:/data
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_HOST: backend-dev
      BACKEND_PORT: 8091
    depends_on:
      backend-dev:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

  backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/signalstack.db
      OTEL_SERVICE_NAME: signalstack-api-prod
    volumes:
      - prod-data:/data
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_HOST: backend-prod
      BACKEND_PORT: 8091
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dev-data:
  prod-data:
