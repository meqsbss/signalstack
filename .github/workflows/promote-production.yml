name: Promote DEV to PROD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character commit SHA of the tested DEV images"
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! echo "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a 40-character commit SHA"
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact backend image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          docker pull ghcr.io/$OWNER/signalstack-backend:$IMAGE_TAG
          docker tag ghcr.io/$OWNER/signalstack-backend:$IMAGE_TAG ghcr.io/$OWNER/signalstack-backend:prod
          docker push ghcr.io/$OWNER/signalstack-backend:prod
      - name: Promote exact frontend image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          docker pull ghcr.io/$OWNER/signalstack-frontend:$IMAGE_TAG
          docker tag ghcr.io/$OWNER/signalstack-frontend:$IMAGE_TAG ghcr.io/$OWNER/signalstack-frontend:prod
          docker push ghcr.io/$OWNER/signalstack-frontend:prod
      - name: Copy production compose and observability config
        if: ${{ vars.DEPLOY_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "compose.prod.yml,observability"
          target: "~/signalstack"
      - name: Promote AI on-call image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          docker pull ghcr.io/$OWNER/signalstack-oncall:$IMAGE_TAG
          docker tag ghcr.io/$OWNER/signalstack-oncall:$IMAGE_TAG ghcr.io/$OWNER/signalstack-oncall:prod
          docker push ghcr.io/$OWNER/signalstack-oncall:prod
      - name: Deploy to production host (optional)
        if: ${{ vars.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONCALL_WEBHOOK_SECRET: ${{ secrets.ONCALL_WEBHOOK_SECRET }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,GHCR_OWNER,GRAFANA_ADMIN_PASSWORD,OPENAI_API_KEY,ONCALL_WEBHOOK_SECRET
          script: |
            mkdir -p ~/signalstack
            cd ~/signalstack
            printf '%s\n' "GHCR_OWNER=$GHCR_OWNER" "IMAGE_TAG=prod" "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD" "OPENAI_API_KEY=$OPENAI_API_KEY" "ONCALL_WEBHOOK_SECRET=$ONCALL_WEBHOOK_SECRET" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose --env-file .env -f compose.prod.yml pull
            docker compose --env-file .env -f compose.prod.yml up -d
